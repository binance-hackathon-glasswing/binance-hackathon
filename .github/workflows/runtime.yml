name: Publish verified PR174 LLM artifact
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-unsigned-pr174-86b1476
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Keegan4/Keegan4-larp-ci-mirror' && github.ref == 'refs/heads/codex/publish-pr174-llm-20261018'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify and publish the original accepted artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERIFICATION_DIR: ${{ runner.temp }}/unsigned-v3-verification
        run: |
          set -euo pipefail
          mkdir -p "$VERIFICATION_DIR"
          gh api "repos/$GH_REPO/actions/runs/39126353379" > "$VERIFICATION_DIR/mirror-run.json"
          gh api "repos/$GH_REPO/actions/runs/39126353379/jobs" > "$VERIFICATION_DIR/mirror-jobs.json"
          gh api "repos/$GH_REPO/actions/runs/39126353379/artifacts" > "$VERIFICATION_DIR/mirror-artifacts.json"
          gh api "repos/$GH_REPO/actions/artifacts/12135774607/zip" > "$VERIFICATION_DIR/original-ci-artifact.zip"
          echo '419bf1c56e4dd0f08c9d4e262abdda78654c2e9e483f3595c8c755b0f25a9b77  original-ci-artifact.zip' > "$VERIFICATION_DIR/artifact.sha256"
          (cd "$VERIFICATION_DIR" && sha256sum -c artifact.sha256)
          python tools/publish_unsigned_pr174.py
          cp docs/build/releases/llm-trial-pr174-86b1476/README.md "$VERIFICATION_DIR/release/README.md"
          gh release create llm-trial-pr174-86b1476 \
            --repo "$GH_REPO" \
            --target 86b14761324faeb8f57df5c0d86ff00320b4361c \
            --prerelease --title 'Unsigned LLM trial — PR174 (86b1476)' \
            --notes-file docs/build/releases/llm-trial-pr174-86b1476/RELEASE_NOTES.md \
            "$VERIFICATION_DIR/release/larp-86b14761324f-x86_64.tar.gz" \
            "$VERIFICATION_DIR/release/larp-86b14761324f-x86_64.tar.gz.sha256" \
            "$VERIFICATION_DIR/release/larp-86b14761324f-x86_64.release.json" \
            "$VERIFICATION_DIR/release/VERIFICATION.json" \
            "$VERIFICATION_DIR/release/BUNDLE.env" \
            "$VERIFICATION_DIR/release/README.md"
          gh api "repos/$GH_REPO/releases/tags/llm-trial-pr174-86b1476" > "$VERIFICATION_DIR/published-release.json"
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          base=Path(os.environ['VERIFICATION_DIR'])
          release=json.loads((base/'published-release.json').read_text())
          report=json.loads((base/'verification.json').read_text())
          assets={a['name']:a for a in release['assets']}
          assert release['prerelease'] and not release['draft']
          assert release['target_commitish']==report['build_id']
          for name in [report['bundle'],report['bundle']+'.sha256',report['manifest'],'VERIFICATION.json','BUNDLE.env','README.md']:
              assert assets[name]['size']==(base/'release'/name).stat().st_size
          assert assets[report['bundle']]['digest']=='sha256:'+report['bundle_sha256']
          assert assets[report['manifest']]['digest']=='sha256:'+report['manifest_sha256']
          print(release['html_url'])
          PYTHON
