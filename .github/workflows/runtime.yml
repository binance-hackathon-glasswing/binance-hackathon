name: Publish verified IDEA-083 candidate
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-idea083-c5be269
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Keegan4/Keegan4-larp-ci-mirror' && github.ref == 'refs/heads/codex/publish-idea083-20261019'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify and publish the original accepted artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERIFICATION_DIR: ${{ runner.temp }}/unsigned-v3-verification
        run: |
          set -euo pipefail
          mkdir -p "$VERIFICATION_DIR"
          gh api "repos/$GH_REPO/actions/runs/39210402678" > "$VERIFICATION_DIR/mirror-run.json"
          gh api "repos/$GH_REPO/actions/runs/39210402678/jobs" > "$VERIFICATION_DIR/mirror-jobs.json"
          gh api "repos/$GH_REPO/actions/runs/39210402678/artifacts" > "$VERIFICATION_DIR/mirror-artifacts.json"
          artifact_id=$(jq -er '[.artifacts[] | select(.name == "larp-bundle-x86_64" and .expired == false)] | if length == 1 then .[0].id else error("Artifact selection failed") end' "$VERIFICATION_DIR/mirror-artifacts.json")
          gh api "repos/$GH_REPO/actions/artifacts/$artifact_id/zip" > "$VERIFICATION_DIR/original-ci-artifact.zip"
          python tools/verify_idea083_release.py
          cp docs/build/releases/idea083-c5be269/README.md "$VERIFICATION_DIR/release/README.md"
          gh release create idea083-c5be269 \
            --repo "$GH_REPO" \
            --target c5be26959a2b99d603c8d548f7c9767c9c2cf1e0 \
            --prerelease --title 'IDEA-083 merged implementation — candidate c5be269' \
            --notes-file docs/build/releases/idea083-c5be269/RELEASE_NOTES.md \
            "$VERIFICATION_DIR/release/larp-c5be26959a2b-x86_64.tar.gz" \
            "$VERIFICATION_DIR/release/larp-c5be26959a2b-x86_64.tar.gz.sha256" \
            "$VERIFICATION_DIR/release/larp-c5be26959a2b-x86_64.release.json" \
            "$VERIFICATION_DIR/release/VERIFICATION.json" \
            "$VERIFICATION_DIR/release/BUNDLE.env" \
            "$VERIFICATION_DIR/release/README.md"
          gh api "repos/$GH_REPO/releases/tags/idea083-c5be269" > "$VERIFICATION_DIR/published-release.json"
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          base=Path(os.environ['VERIFICATION_DIR'])
          release=json.loads((base/'published-release.json').read_text())
          report=json.loads((base/'verification.json').read_text())
          assets={a['name']:a for a in release['assets']}
          assert release['prerelease'] and not release['draft']
          assert release['target_commitish']==report['build_id']
          for name in [report['bundle'],report['bundle']+'.sha256',report['manifest'],'VERIFICATION.json','BUNDLE.env','README.md']:
              assert assets[name]['size']==(base/'release'/name).stat().st_size
          assert assets[report['bundle']]['digest']=='sha256:'+report['bundle_sha256']
          assert assets[report['manifest']]['digest']=='sha256:'+report['manifest_sha256']
          print(release['html_url'])
          PYTHON
