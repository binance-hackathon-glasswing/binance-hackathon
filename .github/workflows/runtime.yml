name: Publish verified unsigned v3 artifact
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-unsigned-v3-d8aa7d5
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Keegan4/Keegan4-larp-ci-mirror' && github.ref == 'refs/heads/codex/publish-unsigned-v3-20261018'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify and publish the original accepted artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERIFICATION_DIR: ${{ runner.temp }}/unsigned-v3-verification
        run: |
          set -euo pipefail
          mkdir -p "$VERIFICATION_DIR"
          gh api "repos/$GH_REPO/actions/runs/39111854179" > "$VERIFICATION_DIR/mirror-run.json"
          gh api "repos/$GH_REPO/actions/runs/39111854179/jobs" > "$VERIFICATION_DIR/mirror-jobs.json"
          gh api "repos/$GH_REPO/actions/runs/39111854179/artifacts" > "$VERIFICATION_DIR/mirror-artifacts.json"
          gh api "repos/$GH_REPO/actions/artifacts/12129754965/zip" > "$VERIFICATION_DIR/original-ci-artifact.zip"
          echo '2f4c0808689376ed6db03aad65de6b0950a53cbce6d3652e84e7f29a611fcee4  original-ci-artifact.zip' > "$VERIFICATION_DIR/artifact.sha256"
          (cd "$VERIFICATION_DIR" && sha256sum -c artifact.sha256)
          python tools/publish_unsigned_v3.py
          cp docs/build/releases/llm-trial-v3-d8aa7d5/README.md "$VERIFICATION_DIR/release/README.md"
          gh release create llm-trial-v3-d8aa7d5 \
            --repo "$GH_REPO" \
            --target d8aa7d53e5e27543135f8729ff7a7afd4450278a \
            --prerelease --title 'Unsigned LLM trial v3 — d8aa7d5' \
            --notes-file docs/build/releases/llm-trial-v3-d8aa7d5/RELEASE_NOTES.md \
            "$VERIFICATION_DIR/release/larp-d8aa7d53e5e2-x86_64.tar.gz" \
            "$VERIFICATION_DIR/release/larp-d8aa7d53e5e2-x86_64.tar.gz.sha256" \
            "$VERIFICATION_DIR/release/larp-d8aa7d53e5e2-x86_64.release.json" \
            "$VERIFICATION_DIR/release/VERIFICATION.json" \
            "$VERIFICATION_DIR/release/BUNDLE.env" \
            "$VERIFICATION_DIR/release/README.md"
          gh api "repos/$GH_REPO/releases/tags/llm-trial-v3-d8aa7d5" > "$VERIFICATION_DIR/published-release.json"
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          base=Path(os.environ['VERIFICATION_DIR'])
          release=json.loads((base/'published-release.json').read_text())
          report=json.loads((base/'verification.json').read_text())
          assets={a['name']:a for a in release['assets']}
          assert release['prerelease'] and not release['draft']
          assert release['target_commitish']==report['build_id']
          for name in [report['bundle'],report['bundle']+'.sha256',report['manifest'],'VERIFICATION.json','BUNDLE.env','README.md']:
              assert assets[name]['size']==(base/'release'/name).stat().st_size
          assert assets[report['bundle']]['digest']=='sha256:'+report['bundle_sha256']
          assert assets[report['manifest']]['digest']=='sha256:'+report['manifest_sha256']
          print(release['html_url'])
          PYTHON
