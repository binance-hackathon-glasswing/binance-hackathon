name: Runtime acceptance
on:
  push:
    # Every branch that can ship: the challenge branch, the integration branch and the review branches (#49).
    branches: [main, 'codex/system-testing-*', 'review/final-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  infrastructure:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      matrix:
        directory: [deploy/aws, deploy/bootstrap]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install checksum-pinned Terraform
        run: |
          curl -fsSLo /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.13.5/terraform_1.13.5_linux_amd64.zip
          echo '0dbe3fcc268eb670801af6a6456799d1ae26e72e73797f6c6167e18aafd1fd9a  /tmp/terraform.zip' | sha256sum -c -
          unzip /tmp/terraform.zip -d /tmp/terraform-bin
          echo '/tmp/terraform-bin' >> "$GITHUB_PATH"
      - run: terraform -chdir=${{ matrix.directory }} fmt -check -recursive
      - run: terraform -chdir=${{ matrix.directory }} init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=${{ matrix.directory }} validate
      - run: terraform -chdir=${{ matrix.directory }} test
  runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:14.24-bookworm@sha256:5a05f61a534e50e679d27fb45953afec7821f2ffc2aa6c738b94515ca0891ac2
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: larp_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 20
    env:
      LARP_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/larp_test
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.15'
      - run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap
      - run: python -m pip install -r deploy/requirements-test.lock
      - run: python -m pip check
      - run: python -m pytest -q -p no:cacheprovider
      # R13: real systemd conditions/refusal/restart behavior, with synthetic releases and disposable units only.
      - run: LARP_TEST_SYSTEMD=1 python -m pytest -q tests/runtime/test_systemd_conditions.py -p no:cacheprovider
      - run: python -m larp.runtime.demo > /tmp/larp-offline-trace.json
      - run: docker build -f deploy/Dockerfile -t larp-runtime:ci .
      - run: docker run --rm --network none --read-only --cap-drop ALL larp-runtime:ci
  host-bundle:
    # IDEA-047 H01/H02: build the x86_64 host bundle from the pushed branch head and provision both roles offline.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.15'
      - run: python tools/build_release_bundle.py --arch x86_64 --out /tmp/larp-bundle
      # IDEA-047 R6: the bundle hash for the activation pack; provision.sh refuses any other bundle.
      - run: |
          {
            echo '### Host bundle (x86_64)'
            echo
            echo '| Build | Bundle | SHA-256 |'
            echo '|---|---|---|'
            for f in /tmp/larp-bundle/larp-*-x86_64.tar.gz; do
              echo "| \`$(git rev-parse HEAD)\` | \`$(basename "$f")\` | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      # Keep the exact bundle whose hash the summary records, for the activation pack (IDEA-047 R6; #49).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: larp-bundle-x86_64
          path: |
            /tmp/larp-bundle/larp-*-x86_64.tar.gz
            /tmp/larp-bundle/larp-*-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90
      - run: bash tools/test_host_bundle.sh /tmp/larp-bundle/larp-*-x86_64.tar.gz
