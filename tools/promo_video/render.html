<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>LARP layers video</title>
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Frame renderer for the 30 s LARP layers video. render(t) draws the frame at
// time t (seconds); render.mjs steps it at 30 fps and pipes frames to ffmpeg.
// Captions (word timings from narrate.py) arrive via setCaptions().
const W = 1080, H = 1920;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
const bctx = buf.getContext('2d');
const tint = document.createElement('canvas'); tint.width = W; tint.height = H;
const tctx = tint.getContext('2d');

const Y = '#F0B90B', C = '#2EE6D6', R = '#FF4D5E', G = '#3DDC84', WH = '#F5F7FA', D = '#8A93A6', BG = '#06080C';
const DISPLAY = '"Inter Display", "Inter", sans-serif';
const MONO = '"JetBrains Mono", monospace';

const LAYERS = [
  { name: 'SOURCES', tag: 'INGEST', glow: C },
  { name: 'EVIDENCE LLM', tag: 'ASSESS-ONLY', glow: Y },
  { name: 'VERIFIER', tag: 'VETO-ONLY', glow: G },
  { name: 'STRATEGY', tag: 'POLICY', glow: Y },
  { name: 'RISK GOVERNOR', tag: 'DETERMINISTIC', glow: R },
  { name: 'EXECUTION', tag: 'SIGN ONCE', glow: C },
  { name: 'AUDIT TRAIL', tag: 'PROVE IT', glow: G },
];
const LAYER0 = 4.0, LAYER_DUR = 3.0, OUTRO = 25.0, END = 30.0;
const CUTS = [2.0, 4.0, 7.0, 10.0, 13.0, 16.0, 19.0, 22.0, 25.0, 27.3];

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = k => 1 - Math.pow(1 - k, 3);
const eIn = k => k * k * k;
const eInOut = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eBack = k => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function rgba(hexc, a) { const n = parseInt(hexc.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }

function rrect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function text(s, x, y, font, color, align = 'left', base = 'alphabetic') {
  ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base; ctx.fillText(s, x, y);
}
function glow(color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; }

const GLYPHS = '!<>-_\\/[]{}=+*^?#01ABCDEFX$%';

    const th = (i / Math.max(1, s.length)) * dur * 0.75;
    if (s[i] === ' ' || u > th + dur * 0.25) out += s[i];

}
function check(x, y, s, color) {

  ctx.beginPath(); ctx.moveTo(x - s * 0.45, y); ctx.lineTo(x - s * 0.12, y + s * 0.32); ctx.lineTo(x + s * 0.5, y - s * 0.38); ctx.stroke();
}

  ctx.beginPath(); ctx.moveTo(x - s * 0.38, y - s * 0.38); ctx.lineTo(x + s * 0.38, y + s * 0.38);
  ctx.moveTo(x + s * 0.38, y - s * 0.38); ctx.lineTo(x - s * 0.38, y + s * 0.38); ctx.stroke();
}

// ---------- static noise / data ----------
const grain = document.createElement('canvas'); grain.width = grain.height = 256;
{ const g = grain.getContext('2d'); const im = g.createImageData(256, 256); const r = rng(3);
  for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0); }
const HEXCOL = (() => { const r = rng(11); return Array.from({ length: 140 }, () => hex(r, 8)); })();
const HASHES = (() => { const r = rng(21); return Array.from({ length: 16 }, () => hex(r, 64)); })();

// ---------- captions ----------
let PAGES = [];
window.setCaptions = function (lines) {
  PAGES = [];
  lines.forEach((line, li) => {
    const nextStart = li + 1 < lines.length ? lines[li + 1].start : END;
    let cur = [];
    const flush = (last) => { if (cur.length) PAGES.push({ words: cur, last }); cur = []; };
    line.words.forEach((w, wi) => {
      cur.push(w);
      if (/[.,?!:]$/.test(w.w) || cur.length === 3) flush(wi === line.words.length - 1);
    });
    flush(true);
    PAGES.forEach((p, pi) => { if (p.end === undefined && p.last) p.end = li + 1 < lines.length ? Math.min(p.words[p.words.length - 1].t1 + 0.4, nextStart) : END; });
  });
  PAGES.forEach((p, i) => {
    p.start = p.words[0].t0 - 0.04;
    if (p.end === undefined) p.end = PAGES[i + 1].words[0].t0 - 0.04;

};
function drawCaptions(t) {
  const p = PAGES.find(p => t >= p.start && t < p.end);
  if (!p) return;
  const font = `900 92px ${DISPLAY}`;
  ctx.font = font;
  const words = p.words.map(w => ({ ...w, s: w.w.toUpperCase(), wd: ctx.measureText(w.w.toUpperCase()).width }));
  const space = 26, maxW = 880, cx = 525;
  const rows = [[]]; let rw = 0;
  for (const w of words) {
    if (rows[rows.length - 1].length && rw + space + w.wd > maxW) { rows.push([]); rw = 0; }
    rows[rows.length - 1].push(w); rw += (rw ? space : 0) + w.wd;
  }
  const lh = 104, y0 = 1400 - (rows.length - 1) * lh / 2;
  rows.forEach((row, ri) => {
    const total = row.reduce((a, w) => a + w.wd, 0) + space * (row.length - 1);
    let x = cx - total / 2;
    for (const w of row) {
      if (t >= w.t0 - 0.03) {
        const k = seg(t, w.t0 - 0.03, w.t0 + 0.12);
        const s = lerp(0.55, 1, eBack(k));
        const active = t >= w.t0 && t < w.t1 + 0.05;
        ctx.save();
        ctx.translate(x + w.wd / 2, y0 + ri * lh);
        ctx.scale(s * (active ? 1.06 : 1), s * (active ? 1.06 : 1));
        ctx.font = font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round'; ctx.lineWidth = 20; ctx.strokeStyle = '#000';
        ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 6;
        ctx.strokeText(w.s, 0, 0);
        ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
        ctx.fillStyle = w.hl ? Y : WH;
        if (w.hl && active) { glow(Y, 30); }
        ctx.fillText(w.s, 0, 0);
        ctx.restore(); noGlow();

    }

}

// ---------- background / HUD ----------
function background(t, accent) {

  const g = ctx.createRadialGradient(540, 860, 40, 540, 860, 760);
  g.addColorStop(0, rgba(accent, 0.13)); g.addColorStop(1, rgba(accent, 0));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(255,255,255,0.045)'; ctx.lineWidth = 1;
  const off = (t * 24) % 60;
  ctx.beginPath();
  for (let x = 0; x <= W; x += 60) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); }
  for (let y = -60; y <= H; y += 60) { ctx.moveTo(0, y + off + 0.5); ctx.lineTo(W, y + off + 0.5); }
  ctx.stroke();

  ctx.font = `400 17px ${MONO}`; ctx.fillStyle = 'rgba(255,255,255,0.07)'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  const sc = (t * 40) % 24, base = Math.floor(t * 40 / 24);
  for (let i = 0; i < 82; i++) {
    const y = i * 24 - sc;
    ctx.fillText(HEXCOL[(i + base) % HEXCOL.length], 14, y);
    ctx.fillText(HEXCOL[(i * 7 + base + 50) % HEXCOL.length], W - 104, y);
  }
}
function hud(t, layerIdx, hookFill) {
  const blink = Math.floor(t * 2) % 2 === 0;
  ctx.fillStyle = blink ? R : rgba(R, 0.3);
  ctx.beginPath(); ctx.arc(92, 214, 9, 0, Math.PI * 2); ctx.fill();
  text('REC', 110, 223, `700 26px ${MONO}`, WH);
  text('LARP://agent', 180, 223, `400 26px ${MONO}`, D);
  const s = t.toFixed(2).padStart(5, '0');
  text(`T+00:${s}`, 1000, 223, `700 26px ${MONO}`, WH, 'right');
  const x0 = 80, x1 = 1000, gap = 10, sw = (x1 - x0 - gap * 6) / 7;
  for (let i = 0; i < 7; i++) {
    const x = x0 + i * (sw + gap);
    ctx.fillStyle = 'rgba(255,255,255,0.14)'; rrect(x, 248, sw, 7, 3.5); ctx.fill();
    let f = 0;
    if (layerIdx === 'outro') f = 1;
    else if (layerIdx === 'hook') f = hookFill(i);
    else if (i < layerIdx) f = 1;
    else if (i === layerIdx) f = seg(t, LAYER0 + i * LAYER_DUR, LAYER0 + (i + 1) * LAYER_DUR);
    if (f > 0) {
      ctx.fillStyle = (layerIdx !== 'hook' && i < layerIdx) ? rgba(Y, 0.55) : Y;
      if (i === layerIdx) glow(Y, 14);

}
function layerHeader(i, u) {
  const L = LAYERS[i];
  const k = eOut(seg(u, 0, 0.25));
  ctx.globalAlpha = k;
  text(`LAYER 0${i + 1} / 07`, 80 - (1 - k) * 40, 352, `800 30px ${MONO}`, Y);
  ctx.strokeStyle = rgba(Y, 0.5); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(370, 342); ctx.lineTo(370 + 400 * k, 342); ctx.stroke();
  const tagW = 30 + L.tag.length * 17;
  ctx.strokeStyle = L.glow; rrect(1000 - tagW, 318, tagW, 44, 8); ctx.stroke();
  text(L.tag, 1000 - tagW / 2, 349, `700 24px ${MONO}`, L.glow, 'center');
  ctx.globalAlpha = 1;
  const s = decode(L.name, u, 0.45, i * 97);
  let size = 148; ctx.font = `900 ${size}px ${DISPLAY}`;
  const w = ctx.measureText(L.name).width; if (w > 920) size = Math.floor(size * 920 / w);

  noGlow();
}
function spec(parts, u, y = 1212) {
  const k = seg(u, 0.5, 0.8);
  if (k <= 0) return;
  ctx.globalAlpha = k;
  ctx.font = `500 27px ${MONO}`;
  const total = parts.reduce((a, [s]) => a + ctx.measureText(s).width, 0) + ctx.measureText('// ').width;
  let x = 525 - total / 2;
  text('// ', x, y, `500 27px ${MONO}`, Y); x += ctx.measureText('// ').width;
  for (const [s, col] of parts) { text(s, x, y, `500 27px ${MONO}`, col || D); x += ctx.measureText(s).width; }

// ---------- isometric tower ----------

  ctx.beginPath(); ctx.moveTo(cx, cy + d); ctx.lineTo(cx + w, cy); ctx.lineTo(cx + w, cy + th); ctx.lineTo(cx, cy + d + th); ctx.closePath(); ctx.fill();

      ctx.fillStyle = o.lit(i) > 0.4 ? Y : WH;

const slabLocal = slab;

// ---------- scenes ----------
const CANDLES = (() => { const r = rng(5); let p = 0; return Array.from({ length: 44 }, (_, i) => {
  const o = p; p += (r() - 0.47) * 26 + (i > 30 ? 5 : 0); const hi = Math.max(o, p) + r() * 14, lo = Math.min(o, p) - r() * 14;
  return { o, c: p, hi, lo }; }); })();
function sceneHookA(t) {
  const u = t;

  const k = eOut(seg(u, 0, 0.3));
  ctx.globalAlpha = k;
  ctx.fillStyle = 'rgba(255,255,255,0.04)'; rrect(80, 330, 920, 190, 18); ctx.fill();
  ctx.strokeStyle = rgba(R, 0.6); ctx.lineWidth = 2; ctx.stroke();

  for (const [col, dx] of [['#ff0000', split], ['#00ffff', -split]]) {
    tctx.globalCompositeOperation = 'source-over'; tctx.drawImage(buf, 0, 0);
    tctx.globalCompositeOperation = 'multiply'; tctx.fillStyle = col; tctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.45 * g; ctx.drawImage(tint, dx, 0);
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}

// ---------- frame ----------
window.render = function (t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  let layer = null, accent = R;
  if (t >= LAYER0 && t < OUTRO) { layer = Math.min(6, Math.floor((t - LAYER0) / LAYER_DUR)); accent = LAYERS[layer].glow; }
  else if (t >= OUTRO) accent = Y;
  else if (t >= 2) accent = Y;
  background(t, accent);
  // beat pulse (120 BPM) + scene entrance
  const bp = t >= 4 && t < 29.4 ? 0.014 * Math.exp(-(t % 0.5) * 12) : 0;
  let ent = 0;
  for (const c of CUTS) if (t >= c && t < c + 0.25) ent = 1 - eOut((t - c) / 0.25);
  const s = 1 + bp + ent * 0.07;
  ctx.save();
  ctx.translate(540, 860); ctx.scale(s, s); ctx.translate(-540, -860 + ent * 50);
  if (t < 2) sceneHookA(t);
  else if (t < LAYER0) sceneHookB(t);
  else if (t < OUTRO) [scene1, scene2, scene3, scene4, scene5, scene6, scene7][layer](t - LAYER0 - layer * LAYER_DUR);
  else sceneOutro(t);
  ctx.restore();
  hud(t, t < LAYER0 ? 'hook' : (t < OUTRO ? layer : 'outro'), i => t < 2 ? 0 : seg(t, 2.08 + (6 - i) * 0.22, 2.28 + (6 - i) * 0.22));
  drawCaptions(t);
  overlays(t);
  glitch(t);
  // fade the last few frames slightly so the loop back to the hook reads as a cut
  if (t > END - 0.25) { ctx.fillStyle = `rgba(0,0,0,${0.6 * seg(t, END - 0.25, END)})`; ctx.fillRect(0, 0, W, H); }
};
window.ready = Promise.all([
  document.fonts.load(`900 100px "Inter Display"`),
  document.fonts.load(`800 30px "JetBrains Mono"`),
  document.fonts.load(`700 30px "JetBrains Mono"`),
  document.fonts.load(`500 30px "JetBrains Mono"`),
  document.fonts.load(`400 30px "JetBrains Mono"`),
]);
</script>
</body>
